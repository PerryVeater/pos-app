# Server port
server.port=8080

# Postgres datasource (overridable via environment variables; values below
# are the local development defaults matching docker-compose.yml)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/posdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:posuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pospassword}

# Flyway schema migrations (applied before Hibernate validates the schema)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Lets a pre-Flyway database adopt migrations without recreating it:
# V1 is skipped on such databases, all later versions still apply.
spring.flyway.baseline-on-migrate=true

# JPA / Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Schema is owned by Flyway: Hibernate only verifies it at startup.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Employee POS PIN policy. Accepted PINs are digit strings whose length is
# within [min-length, max-length]; the value is never trimmed or normalized
# so leading zeros are preserved. pbkdf2-iterations is the work factor for
# the stored salted hash, and hmac-secret makes the deterministic PIN
# fingerprint stable within a deployment (it MUST be overridden with a
# high-entropy secret outside local development, e.g. via POS_PIN_HMAC_SECRET).
pos.pin.min-length=${POS_PIN_MIN_LENGTH:4}
pos.pin.max-length=${POS_PIN_MAX_LENGTH:6}
pos.pin.pbkdf2-iterations=${POS_PIN_PBKDF2_ITERATIONS:120000}
pos.pin.hmac-secret=${POS_PIN_HMAC_SECRET:dev-only-pin-fingerprint-secret-change-me}

# POS authentication sessions. ttl is the absolute bearer-session lifetime
# measured from issuance (Spring Duration format, e.g. 8h / 30m / PT8H). The
# raw session token is returned once at authentication and only its SHA-256
# hash is stored; a session stops working at expiry, on logout, or when the
# credential behind it changes. max-per-employee caps how many live sessions
# one employee may hold: the oldest is revoked when the next login would
# exceed the cap, so a terminal that never logged out cannot keep a session
# alive forever. retention is the audit window - a background job deletes
# rows whose expiry passed more than `retention` ago, `purge-batch-size` rows
# per transaction, and purge-enabled=false turns that job off entirely.
pos.session.ttl=${POS_SESSION_TTL:8h}
pos.session.max-per-employee=${POS_SESSION_MAX_PER_EMPLOYEE:3}
pos.session.retention=${POS_SESSION_RETENTION:7d}
pos.session.purge-batch-size=${POS_SESSION_PURGE_BATCH_SIZE:500}
pos.session.purge-enabled=${POS_SESSION_PURGE_ENABLED:true}

# PIN-authentication rate limiting, scoped per (store, client). A client is
# locked out for `cooldown` once `max-attempts` failed attempts accumulate
# within the rolling `window`. `trust-forwarded-for` defaults to false so the
# remote address is used; enable it ONLY behind a trusted reverse proxy that
# overwrites X-Forwarded-For, otherwise clients could spoof the header to
# evade the limit. `max-entries` bounds the in-memory bucket map so arbitrary
# client input cannot grow it without limit. NOTE: the limiter is process-local
# (single-instance) and is not shared across application instances.
pos.auth.rate-limit.max-attempts=${POS_AUTH_RATE_LIMIT_MAX_ATTEMPTS:5}
pos.auth.rate-limit.window=${POS_AUTH_RATE_LIMIT_WINDOW:5m}
pos.auth.rate-limit.cooldown=${POS_AUTH_RATE_LIMIT_COOLDOWN:15m}
pos.auth.rate-limit.trust-forwarded-for=${POS_AUTH_RATE_LIMIT_TRUST_FORWARDED_FOR:false}
pos.auth.rate-limit.max-entries=${POS_AUTH_RATE_LIMIT_MAX_ENTRIES:100000}
