# Server port
server.port=8080

# Postgres datasource (overridable via environment variables; values below
# are the local development defaults matching docker-compose.yml)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/posdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:posuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pospassword}

# Flyway schema migrations (applied before Hibernate validates the schema)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Lets a pre-Flyway database adopt migrations without recreating it:
# V1 is skipped on such databases, all later versions still apply.
spring.flyway.baseline-on-migrate=true

# JPA / Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Schema is owned by Flyway: Hibernate only verifies it at startup.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
