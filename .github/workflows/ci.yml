name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege by default; the image job opts into package writes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history so the whitespace check can diff against the merge base
          # of a branch, not just the last commit.
          fetch-depth: 0

      - name: Check whitespace hygiene
        shell: bash
        run: |
          git fetch --no-tags origin main
          base="$(git merge-base HEAD origin/main)"
          echo "Checking whitespace introduced since ${base}"
          git diff --check "${base}"..HEAD

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Verify (compile, test, package)
        working-directory: app
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      # A red build is only diagnosable if the report is still available after
      # the runner is discarded. The console log alone is not enough once a
      # large suite fails.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: app/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

  image:
    name: Publish image
    needs: verify
    # Images are published from main only: a pull request (from a fork or
    # otherwise) must never be able to publish over the released tag.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute image name
        shell: bash
        # ghcr.io rejects uppercase path segments, while github.repository keeps
        # the owner's display casing (PerryVeater/pos-app). Lowercase it here and
        # echo it, so the effective image name is visible in the log on failure.
        run: |
          IMAGE="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "Publishing to $IMAGE"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache,mode=max
